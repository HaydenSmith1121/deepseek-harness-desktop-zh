name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      build_all_platforms:
        description: 同时尝试构建 macOS / Linux（尚未实机验证）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 单元测试：运行时探测 / 就绪解析 / 设置 / 窗口状态 ──────────────────────
  test:
    name: 单元测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: 安装依赖
        run: npm ci
        env:
          # 测试不需要 Electron 二进制，跳过下载以加速 CI
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: 运行测试
        run: npm test
      - name: 校验图标生成脚本
        run: npm run icons

  # ── Windows 产物：安装包 + 绿色版，并对打包后的应用做真实启动自检 ──────────
  build-windows:
    name: Windows 产物
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: 安装依赖
        run: npm ci

      - name: 拉取内置 dsh 运行时
        run: npm run fetch:dsh

      - name: 打包（NSIS 安装包 + zip 免安装版）
        run: npx electron-builder --win --publish never

      - name: 检查打包产物里是否带上了内置 dsh
        shell: pwsh
        run: |
          $res = "release\win-unpacked\resources"
          Write-Host "resources/ 下的条目："
          Get-ChildItem $res | Select-Object -ExpandProperty Name | ForEach-Object { Write-Host "  - $_" }
          $entry = Join-Path $res "dsh\node_modules\@deepseek-ai\dsh\lib\bin.js"
          if (-not (Test-Path $entry)) { throw "打包产物里缺少内置 dsh 运行时：$entry" }
          Write-Host "内置 dsh 入口就位：$entry"

      - name: 对打包产物做端到端自检
        timeout-minutes: 10
        shell: pwsh
        run: |
          $exe = "release\win-unpacked\DeepSeekHarnessDesktop.exe"
          if (-not (Test-Path $exe)) { throw "未找到打包产物：$exe" }

          $outDir = "$PWD\.self-test"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          # 关键：Electron 是 GUI 子系统程序，PowerShell 的 & 调用**不会等待**它结束，
          # $LASTEXITCODE 会是 $null，于是"退出码非 0"的判断会误报失败。
          # 必须用 Start-Process -Wait 才能拿到真实退出码。
          $p = Start-Process -FilePath $exe -Wait -PassThru `
            -ArgumentList "--self-test", "--self-test-out=$outDir", "--user-data-dir=$PWD\.ci-userdata" `
            -RedirectStandardOutput "$PWD\.self-test-stdout.txt" `
            -RedirectStandardError "$PWD\.self-test-stderr.txt"

          Write-Host "──── stdout ────"
          Get-Content "$PWD\.self-test-stdout.txt" -ErrorAction SilentlyContinue | Write-Host
          Write-Host "──── stderr ────"
          Get-Content "$PWD\.self-test-stderr.txt" -ErrorAction SilentlyContinue | Write-Host

          if ($p.ExitCode -ne 0) { throw "打包产物自检失败，退出码 $($p.ExitCode)" }
          Write-Host "打包产物自检通过 ✅"

          $json = Join-Path $outDir "self-test-report.json"
          if (Test-Path $json) {
            $report = Get-Content $json -Raw | ConvertFrom-Json
            Write-Host "标题=$($report.page.title) 节点数=$($report.page.nodeCount) 检查项=$($report.checks.Count) 截图=$($report.screenshots.Count)"
          }

      - name: 解压 zip 免安装版并自检（真正交付给用户的产物）
        # 这一步不能省：win-unpacked 是构建过程中已经躺在磁盘上的目录，从它启动
        # 不涉及任何解压。用户拿到的 zip 必须解压后再验一遍才算数。
        timeout-minutes: 10
        shell: pwsh
        run: |
          $zip = Get-ChildItem "release\*.zip" | Select-Object -First 1
          if (-not $zip) { throw "未找到 zip 免安装产物" }
          Write-Host "待验产物：$($zip.Name)（$([math]::Round($zip.Length / 1MB)) MB）"

          $target = "$PWD\zip-unpacked"
          Expand-Archive -Path $zip.FullName -DestinationPath $target -Force

          $exe = Join-Path $target "DeepSeekHarnessDesktop.exe"
          if (-not (Test-Path $exe)) { throw "zip 内未找到主程序：$exe" }
          $entry = Join-Path $target "resources\dsh\node_modules\@deepseek-ai\dsh\lib\bin.js"
          if (-not (Test-Path $entry)) { throw "zip 内缺少内置 dsh 运行时：$entry" }

          $outDir = "$PWD\.self-test-zip"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath $exe -Wait -PassThru `
            -ArgumentList "--self-test", "--self-test-out=$outDir", "--user-data-dir=$PWD\.ci-userdata-zip" `
            -RedirectStandardOutput "$PWD\.self-test-zip-stdout.txt" `
            -RedirectStandardError "$PWD\.self-test-zip-stderr.txt"
          $sw.Stop()

          Get-Content "$PWD\.self-test-zip-stdout.txt" -ErrorAction SilentlyContinue | Write-Host
          Get-Content "$PWD\.self-test-zip-stderr.txt" -ErrorAction SilentlyContinue | Write-Host

          if ($p.ExitCode -ne 0) { throw "zip 免安装版自检失败，退出码 $($p.ExitCode)" }
          Write-Host "zip 免安装版自检通过，耗时 $([math]::Round($sw.Elapsed.TotalSeconds, 1)) 秒"

      - name: 空机器自检（无 Node、无 dsh，只靠内置运行时）
        timeout-minutes: 10
        shell: pwsh
        run: |
          $exe = "release\win-unpacked\DeepSeekHarnessDesktop.exe"
          $outDir = "$PWD\.self-test-bare"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          # 把 node/npm 从 PATH 里摘掉，模拟"目标机器什么都没装"，
          # 强制走 Electron 自带 Node + 内置 dsh 副本这条兜底链路。
          # 这条路径必须单独跑：上面那次自检用的是 setup-node 装的系统 Node。
          $savedPath = $env:PATH
          $env:PATH = "C:\Windows\system32;C:\Windows"

          $p = Start-Process -FilePath $exe -Wait -PassThru `
            -ArgumentList "--self-test", "--self-test-out=$outDir", "--user-data-dir=$PWD\.ci-userdata-bare" `
            -RedirectStandardOutput "$PWD\.self-test-bare-stdout.txt" `
            -RedirectStandardError "$PWD\.self-test-bare-stderr.txt"

          $env:PATH = $savedPath

          Write-Host "──── stdout ────"
          Get-Content "$PWD\.self-test-bare-stdout.txt" -ErrorAction SilentlyContinue | Write-Host
          Write-Host "──── stderr ────"
          Get-Content "$PWD\.self-test-bare-stderr.txt" -ErrorAction SilentlyContinue | Write-Host

          if ($p.ExitCode -ne 0) { throw "空机器自检失败，退出码 $($p.ExitCode)" }
          Write-Host "空机器自检通过 ✅（完全依赖内置运行时）"

      - name: 上传自检截图与报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-report
          path: |
            .self-test/
            .self-test-bare/
            .self-test-zip/
            .self-test-stdout.txt
            .self-test-stderr.txt
            .self-test-bare-stdout.txt
            .self-test-bare-stderr.txt
            .self-test-zip-stdout.txt
            .self-test-zip-stderr.txt
          if-no-files-found: ignore

      - name: 上传安装包与绿色版
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-desktop-windows
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

  # ── 打 tag（v*）时把产物发成 Release，README 里的下载链接就指向这里 ────────
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deepseek-harness-desktop-windows
          path: artifacts
      - name: 创建 Release 并附带安装包 / 绿色版
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "DeepSeek Harness 桌面端 $GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/*.exe artifacts/*.zip artifacts/*.blockmap

  # ── 其它平台：仅手动触发时运行，尚未实机验证 ─────────────────────────────
  build-others:
    name: ${{ matrix.label }}
    if: github.event_name == 'workflow_dispatch' && inputs.build_all_platforms
    needs: test
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS 产物（实验）
            args: --mac
          - os: ubuntu-latest
            label: Linux 产物（实验）
            args: --linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run fetch:dsh
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.os }}
          path: release/*
          if-no-files-found: warn
